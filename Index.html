<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librito para Franco 💖</title>
    <style>
        /* Estilos generales */
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Contenedor principal del libro */
        .book-container {
            perspective: 2000px;
            position: relative;
            width: 400px;
            height: 600px;
        }

        /* El libro en sí */
        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        /* Cada página individual */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 5px;
            box-shadow: inset 3px 0 10px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.3);
            backface-visibility: hidden;
            transform-origin: left center;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: transform 0.8s ease;
        }

        /* Estilo de las imágenes dentro del libro */
        .page img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        /* Clases para corregir la orientación de las imágenes */
        .rot-180 { transform: rotate(180deg); }
        .rot-90 { transform: rotate(90deg) scale(0.65); }
        .rot-270 { transform: rotate(-90deg) scale(0.65); }
        .rot-0 { transform: rotate(0deg); }

        /* Estado de las páginas cuando se voltean */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Botones de control */
        .controls {
            position: absolute;
            bottom: -70px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            background-color: #ecf0f1;
            color: #2c3e50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #bdc3c7;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Decoración de fondo (opcional) */
        .table-shadow {
            position: absolute;
            bottom: -20px;
            left: 5%;
            width: 90%;
            height: 20px;
            background: rgba(0,0,0,0.5);
            filter: blur(10px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="book" id="book">
            <!-- Página 1: 1/Sep/26 - "Te quiero mucho mi corazón" (Correcta) -->
            <div class="page">
                <img src="IMG20260929_233703.jpg" alt="Página 1" class="rot-0">
            </div>
            <!-- Página 2: 2/Sep/26 - "Corazón te sale excelente" (Correcta) -->
            <div class="page">
                <img src="IMG_20260929_233719.jpg" alt="Página 2" class="rot-0">
            </div>
            <!-- Página 3: 2/Sep/26 - "Love has a letter but..." (Invertida 180) -->
            <div class="page">
                <img src="IMG20260929_233737.jpg" alt="Página 3" class="rot-180">
            </div>
            <!-- Página 4: 2/Sep/26 - "Red is for blood..." (Invertida 180) -->
            <div class="page">
                <img src="IMG_20260929_233748.jpg" alt="Página 4" class="rot-180">
            </div>
            <!-- Página 5: 2/Sep/26 - "Sakros has to que el..." (Invertida 180) -->
            <div class="page">
                <img src="IMG-IMG_20260929_233804.jpg" alt="Página 5" class="rot-180">
            </div>
            <!-- Página 6: 3/Sep/26 - "Amo tenerte en mi vida..." (Girada 90) -->
            <div class="page">
                <img src="IMG-20260929_233837.jpg" alt="Página 6" class="rot-90">
            </div>
            <!-- Página 7: 5/Sep/26 - "Resulta extraño estar atrapada..." (Girada 90) -->
            <div class="page">
                <img src="IMG_20260929_233901.jpg" alt="7" class="rot-90">
            </div>
            <!-- Página 8: 5/Sep/26 - "No es por sonar cursi..." (Girada 90) -->
            <div class="page">
                <img src="IMG-20260929_233911.jpg" alt="Página 8" class="rot-90">
            </div>
            <!-- Página 9: Corazón de papel - "Te amo mi amor hermoso" (Girada -90) -->
            <div class="page">
                <img src="IMG-20260929_233933.jpg" alt="Página 9" class="rot-270">
            </div>
            <!-- Página 10: Corazón de papel - "Para: Franco..." (Invertida 180) -->
            <div class="page">
                <img src="IMG_20260929_234000.jpg" alt="Página 10" class="rot-180">
            </div>
        </div>
        
        <!-- Sombra decorativa debajo del libro -->
        <div class="table-shadow"></div>

        <!-- Controles para pasar página -->
        <div class="controls">
            <button onclick="prevPage()">Anterior</button>
            <button onclick="nextPage()">Siguiente</button>
        </div>
    </div>

    <script>
        let currentPage = 0;
        const pages = document.querySelectorAll('.page');
        
        // Función para actualizar la posición de las páginas
        function updateBook() {
            pages.forEach((page, index) => {
                if (index < currentPage) {
                    // Páginas ya leídas (volteadas a la izquierda)
                    page.style.transform = 'rotateY(-180deg)';
                    page.style.zIndex = index;
                } else {
                    // Páginas por leer (apiladas a la derecha)
                    page.style.transform = 'rotateY(0deg)';
                    page.style.zIndex = pages.length - index;
                }
            });
        }

        // Avanzar página
        function nextPage() {
            if (currentPage < pages.length) {
                currentPage++;
                updateBook();
            }
        }

        // Retroceder página
        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updateBook();
            }
        }

        // Inicializar el libro al cargar la página
        updateBook();
    </script>
</body>
</html>
